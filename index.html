<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>BD Nono Evoli</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8e6;
      color: #222;
      overflow-x: hidden;
    }
    #cover {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: #1e90ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #cover.hidden { display: none; }
    .cloud {
      position: absolute;
      background: white;
      border-radius: 999px;
      opacity: 0.9;
    }
    .c1 { width:150px; height:44px; top:12%; left:8%; }
    .c2 { width:190px; height:52px; top:22%; right:6%; }
    .c3 { width:130px; height:38px; top:70%; left:10%; }
    .c4 { width:170px; height:46px; top:80%; right:10%; }
    .c5 { width:110px; height:34px; top:48%; left:42%; }
    .jouer {
      background:#2ecc71;
      color:white;
      border:none;
      padding:22px 52px;
      border-radius:999px;
      font-size:30px;
      font-weight:900;
      box-shadow:0 8px 0 #1e8449;
      cursor:pointer;
      position:relative;
    }
    .soundBtn,
    .backArrow {
      position: fixed;
      top: 12px;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 650;
    }
    .soundBtn {
      right: 78px;
      background: white;
      color: #222;
      border: 3px solid #222;
    }
    .backArrow {
      left: 12px;
      background: white;
      color: #222;
      border: 3px solid #222;
      display: none;
    }
    .wrap {
      max-width: 720px;
      margin: auto;
      padding: 18px 10px 80px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      margin: 10px 0;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }
    .slide {
      min-width: 100%;
      padding: 4px;
    }
    .slider {
      display: flex;
      transition: transform .35s ease;
    }
    img.bd {
      width: 100%;
      border-radius: 14px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="cover">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
    <button class="jouer" type="button">JOUER</button>
  </div>

  <button class="soundBtn" id="soundBtn" type="button">🔊</button>
  <button class="backArrow" id="backArrow" type="button">←</button>

  <div class="wrap">
    <div class="slider" id="slider">
      <div class="slide">
        <div class="card">
          <h2>BD ABONNEMENT</h2>
          <img class="bd" src="1794084746299.jpg" alt="BD Abonnement">
        </div>
      </div>
      <div class="slide">
        <div class="card">
          <h2>BD PARRAINAGE</h2>
          <p>Marche et gagne des récompenses !</p>
          <div class="codeBox" style="font-size:26px;font-weight:900;text-align:center;background:#fff3b0;border:2px dashed #ff8c00;border-radius:12px;padding:10px;">
            FideleCygne3378
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var soundOn = true;

    function playSound(kind) {
      if (!soundOn) return;
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        gain.gain.value = 0.12;
        osc.frequency.value = (kind === 'jouer') ? 660 : 440;
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function startApp() {
      try {
        var cover = document.getElementById('cover');
        if (cover) cover.classList.add('hidden');
        playSound('jouer');
        var back = document.getElementById('backArrow');
        if (back) back.style.display = 'flex';
      } catch (e) {
        console.error('startApp error:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.querySelector('.jouer');
      if (btn) {
        btn.addEventListener('click', startApp);
      }

      var soundBtn = document.getElementById('soundBtn');
      if (soundBtn) {
        soundBtn.addEventListener('click', function () {
          soundOn = !soundOn;
          soundBtn.textContent = soundOn ? '🔊' : '🔇';
          if (soundOn) playSound('click');
        });
      }
    });
  </script>
</body>
</html>
