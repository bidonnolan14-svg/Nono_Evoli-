<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>BD Nono Evoli</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#fff8e6;color:#222;overflow-x:hidden}
    #cover{position:fixed;inset:0;z-index:900;background:#1e90ff;display:flex;justify-content:center;align-items:center;overflow:hidden}
    #cover.hidden{display:none}
    .cloud{position:absolute;background:white;border-radius:999px}.c1{width:150px;height:44px;top:12%;left:8%}.c2{width:190px;height:52px;top:22%;right:6%}.c3{width:130px;height:38px;top:70%;left:10%}.c4{width:170px;height:46px;top:80%;right:10%}.c5{width:110px;height:34px;top:48%;left:42%}
    .jouer{background:#2ecc71;color:white;border:none;padding:22px 52px;border-radius:999px;font-size:30px;font-weight:900;box-shadow:0 8px 0 #1e8449;cursor:pointer;position:relative}
    .soundBtn{position:fixed;top:12px;right:78px;z-index:650;width:54px;height:54px;background:white;color:#222;border:3px solid #222;border-radius:16px;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .backArrow{position:fixed;top:12px;left:12px;z-index:900;width:54px;height:54px;background:white;color:#222;border:3px solid #222;border-radius:16px;font-size:28px;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center}
    .wrap{max-width:720px;margin:auto;padding:10px;padding-bottom:80px}.slider{display:flex;transition:transform .35s ease}.slide{min-width:100%;padding:4px}.card{background:white;border-radius:20px;padding:16px;margin:8px 0}
    .codeBox{font-size:26px;font-weight:900;text-align:center;background:#fff3b0;border:2px dashed #ff8c00;border-radius:12px;padding:10px}
    img.bd{width:100%;border-radius:14px;cursor:zoom-in;display:block}
  </style>
</head>
<body>
  <div id="cover">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
    <button class="jouer" onclick="startApp()" type="button">JOUER</button>
  </div>

  <button class="soundBtn" id="soundBtn" onclick="toggleSound()" type="button">🔊</button>
  <button class="backArrow" id="backArrow" onclick="goBack()" type="button">←</button>

  <div class="wrap">
    <div style="overflow:hidden;border-radius:22px">
      <div class="slider" id="slider">
        <div class="slide">
          <div style="background:#ff0000;border-radius:22px;padding:8px">
            <div class="card">
              <h2>BD ABONNEMENT</h2>
              <img class="bd" src="1794084746299.jpg" alt="BD Abonnement">
            </div>
          </div>
        </div>
        <div class="slide">
          <div style="background:#ff8c00;border-radius:22px;padding:8px">
            <div class="card">
              <h2>BD PARRAINAGE</h2>
              <p>Marche et gagne des récompenses !</p>
              <div class="codeBox">FideleCygne3378</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var soundOn = true;

    function playSound(kind) {
      if (!soundOn) return;
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = (kind === 'jouer') ? 660 : 440;
        o.type = 'sine';
        g.gain.value = 0.12;
        o.start();
        o.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function toggleSound() {
      soundOn = !soundOn;
      var b = document.getElementById('soundBtn');
      if (b) b.textContent = soundOn ? '🔊' : '🔇';
      if (soundOn) playSound('click');
    }

    function startApp() {
      playSound('jouer');
      document.getElementById('cover').classList.add('hidden');
      var b = document.getElementById('backArrow');
      if (b) b.style.display = 'flex';
    }

    function goBack() {
      document.getElementById('cover').classList.remove('hidden');
      var b = document.getElementById('backArrow');
      if (b) b.style.display = 'none';
    }
  </script>
</body>
</html>
